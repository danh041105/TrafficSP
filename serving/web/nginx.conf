# Phục vụ bản build React + chuyển /api sang serving-api trong traffic-net
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # resolver của Docker: phân giải serving-api lúc request (web không phụ thuộc thứ tự khởi động)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://serving-api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_read_timeout 90s;
    }
    location / {
        try_files $uri /index.html;
    }
}
