x-airflow-common: &airflow-common
  image: ad/airflow:3.3.2
  env_file:
    - ./conf/airflow.env          
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
  networks:
    - traffic-net

services:
# PostgresSQL: metadata của Airflow + Iceberg JDBC Catalog
  postgresql:
    image: postgres:17
    container_name: traffic-postgres
    hostname: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
      - AIRFLOW_DB_PASSWORD=${AIRFLOW_DB_PASSWORD}
      - ICEBERG_DB_PASSWORD=${ICEBERG_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./conf/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - traffic-net

# Airflow
  # Khởi tạo airflow
  airflow-init:
    <<: *airflow-common
    build:
      context: ./dockerfiles
      dockerfile: airflow.dockerfile
    container_name: traffic-airflow-init
    command: version
    environment:
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_ADMIN_USER}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_ADMIN_PASSWORD}
    depends_on:
      postgresql:
        condition: service_healthy
  
  # giao diện web + api 
  airflow-apiserver:
    <<: *airflow-common
    container_name: traffic-airflow-apiserver
    hostname: airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"     # Airflow UI
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
  
  # lập lịch + chạy task 
  airflow-scheduler:
    <<: *airflow-common
    container_name: traffic-airflow-scheduler
    hostname: airflow-scheduler
    command: scheduler
    environment:
      - KAFKA_BOOTSTRAP=kafka:29092
      - SPARK_LOCAL_HOSTNAME=airflow-scheduler   # executor trên worker gọi ngược về driver bằng tên này
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./jobs:/opt/airflow/jobs
      - ./conf/spark-defaults.conf:/opt/spark-conf/spark-defaults.conf:ro
      - ./data:/opt/data:ro 
    ports:
      - "4040:4040"     # Spark UI của job đang chạy
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Đọc và phân tích file DAG
  airflow-dag-processor:
    <<: *airflow-common
    container_name: traffic-airflow-dag-processor
    hostname: airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

# Minio (Lakehouse Storage)
  minio:
    # image: quay.io/minio/aistor/minio@sha256:107cf2014a9583c74c11e3cdbd6903d89c2244355886b89ce532f4ecae9c23f3
    # docker-compose up -d rồi docker exec minio-aistor minio --version để lấy phiên bản phù hợp
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    container_name: traffic-minio-aistor
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: minio server /data --console-address ":9001" --license /minio.license
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    volumes:
      - ./docker-data/minio_data:/data
      - ./minio.license:/minio.license:ro
    networks:
      - traffic-net
  
  minio-init:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    container_name: traffic-minio-aistor-init
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        echo 'Chờ MinIO...'; sleep 2;
      done;
      mc mb --ignore-existing local/lakehouse;
      "
    restart: "no"
    networks:
      - traffic-net

# Kafka: KRaft 1 node (broker + controller), không cần Zookeeper
  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    hostname: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk   # cố định để giữ được dữ liệu khi tạo lại container
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # INTERNAL: container trong traffic-net (Spark, Airflow, Kafka UI) dùng kafka:29092
      # EXTERNAL: script chạy trên máy (venv) dùng localhost:9092
      - KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      # chỉ có 1 broker nên replication factor = 1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - KAFKA_HEAP_OPTS=-Xmx1G -Xms1G
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data #Lưu trên wsl2, log segment của Kafka ghi lên bind mount Windows dễ lỗi
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - traffic-net

  # Kafka init: tự tạo topic
  kafka-init:
    image: apache/kafka:4.1.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic traffic_raw --partitions 4 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic weather_raw --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
      "
    restart: "no"
    networks:
      - traffic-net
      
  # Producer: chạy tay theo từng giai đoạn, không tự chạy khi docker compose up
  producer:
    build:
      context: ./dockerfiles
      dockerfile: producer.dockerfile
    image: ad/producer:3.10
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP=kafka:29092
      - PYTHONPATH=/app/jobs
    volumes:
      - ./jobs:/app/jobs:ro
      - ./scripts:/app/scripts:ro
      - ./data:/app/data:ro
      - ./logs:/app/logs          # tóm tắt chạy producer (--summary-file)
    networks:
      - traffic-net

  # Kafka UI: xem topic, message, consumer group
  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    container_name: kafka-ui
    environment:
      - KAFKA_CLUSTERS_0_NAME=traffic
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - DYNAMIC_CONFIG_ENABLED=true
    ports:
      - "8085:8080"     # 8080 của máy đã dành cho Airflow
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - traffic-net

# Spark
  spark-master:
    build:
      context: ./dockerfiles
      dockerfile: spark.dockerfile
    image: ad/spark:3.5.0
    container_name: traffic-spark-master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    environment:
      - KAFKA_BOOTSTRAP=kafka:29092
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_REGION=us-east-1
      # Speed layer (driver chạy trên spark-master) ghi ClickHouse qua HTTP
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - PYTHONPATH=/opt/spark/jobs
    volumes:
      - ./jobs:/opt/spark/jobs
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    ports:
      - "8090:8080" # Spark Master UI
      - "4041:4040" # Spark UI của job submit từ spark-master (4040 đã dành cho Airflow)
      - "7077:7077"
    restart: unless-stopped
    networks:
      - traffic-net
# Spark worker: Để 2 Worker
  spark-worker-1:
    image: ad/spark:3.5.0
    container_name: traffic-spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --cores 4 --memory 4g --webui-port 8081
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_REGION=us-east-1
      - SPARK_WORKER_OPTS=-Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.appDataTtl=259200
    volumes:
      - ./jobs:/opt/spark/jobs
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./data:/opt/data:ro 
    ports:
      - "8091:8081" # worker 1 UI
    restart: unless-stopped
    networks:
      - traffic-net

  spark-worker-2:
    image: ad/spark:3.5.0
    container_name: traffic-spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --cores 4 --memory 4g --webui-port 8081
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_REGION=us-east-1
      - SPARK_WORKER_OPTS=-Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.appDataTtl=259200
    volumes:
      - ./jobs:/opt/spark/jobs
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./data:/opt/data:ro 
    ports:
      - "8092:8081" # worker 2 UI
    restart: unless-stopped
    networks:
      - traffic-net
  # Grafana: Monitoring and Alerting
  grafana:
    image: grafana/grafana:13.2.4-slim
    container_name: traffic-grafana
    hostname: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PLUGINS_PREINSTALL_SYNC=grafana-clickhouse-datasource
    volumes:
      - ./docker-data/grafana:/var/lib/grafana
    restart: unless-stopped
    networks:
      - traffic-net
  # Clickhouse: Hot tier storage OLAP
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: traffic-clickhouse
    hostname: clickhouse
    environment:
      - CLICKHOUSE_DB=anomaly
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ports:
      - "8123:8123"     # HTTP: FastAPI, Grafana, Spark JDBC
      - "19000:9000"    # native TCP (cổng 9000 của máy đã dành cho MinIO)
    ulimits: # cấu hình giới hạn tài nguyên và  số file được mở cùng lúc
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse #Lưu trên wsl2 để có gì query các thứ cho nhanh
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - traffic-net

networks:
  traffic-net:
    name: traffic-net
    driver: bridge
volumes:
  clickhouse_data:
    name: traffic_clickhouse_data
  postgres_data:
    name: traffic_postgres_data
  kafka_data:
    name: traffic_kafka_data