# TrafficSP - phần việc của Mai: Serving Layer (API + dashboard) và Monitoring.
# Bản rút gọn từ docker-compose.yml của repo TrafficSP: chỉ gồm các service cần cho phần này.
#
#   Demo 1 lệnh:            bash run_demo.sh up
#   Chỉ monitoring:         bash scripts/monitoring_demo/run_demo.sh up
#   Chỉ serving (demo):     SERVING_SOURCE=demo docker compose --profile demo up -d
#   Serving đọc Trino thật: chạy trong repo TrafficSP đầy đủ (xem README.md mục 9)

services:
# ---------------------------------------------------------------- Kafka (nguồn dữ liệu cho monitoring)
  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    hostname: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk   # cố định để giữ được dữ liệu khi tạo lại container
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # INTERNAL: container trong traffic-net (Spark, Airflow, Kafka UI) dùng kafka:29092
      # EXTERNAL: script chạy trên máy (venv) dùng localhost:9092
      - KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      # chỉ có 1 broker nên replication factor = 1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - KAFKA_HEAP_OPTS=-Xmx1G -Xms1G
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data #Lưu trên wsl2, log segment của Kafka ghi lên bind mount Windows dễ lỗi
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - traffic-net

  kafka-init:
    image: apache/kafka:4.1.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic traffic_raw --partitions 4 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic weather_raw --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
      "
    restart: "no"
    networks:
      - traffic-net

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    container_name: kafka-ui
    environment:
      - KAFKA_CLUSTERS_0_NAME=traffic
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - DYNAMIC_CONFIG_ENABLED=true
    ports:
      - "8085:8080"     # 8080 của máy đã dành cho Airflow
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - traffic-net

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: traffic-kafka-exporter
    hostname: kafka-exporter
    command:
      - --kafka.server=kafka:29092
      - --kafka.version=3.6.0   # mặc định 2.0.0 quá cũ so với Kafka 4.x
    ports:
      - "127.0.0.1:9308:9308"   # xem thử metric: curl localhost:9308/metrics
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - traffic-net

# ---------------------------------------------------------------- Spark
  spark-master:
    build:
      context: ./dockerfiles
      dockerfile: spark.dockerfile
    image: ad/spark:3.5.0
    container_name: traffic-spark-master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    environment:
      - KAFKA_BOOTSTRAP=kafka:29092
      - PYTHONPATH=/opt/spark/jobs
      - ICEBERG_DB_PASSWORD=${ICEBERG_DB_PASSWORD:-}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-}
      - AWS_REGION=us-east-1
    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    ports:
      - "8090:8080" # Spark Master UI
      - "7077:7077"
    restart: unless-stopped
    networks:
      - traffic-net

  spark-worker-1:
    image: ad/spark:3.5.0
    container_name: traffic-spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --cores 4 --memory 4g --webui-port 8081
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-}
      - AWS_REGION=us-east-1
      - SPARK_WORKER_OPTS=-Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.appDataTtl=259200
    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./data:/opt/data:ro 
    ports:
      - "8091:8081" # worker 1 UI
    restart: unless-stopped
    networks:
      - traffic-net

  spark-worker-2:
    image: ad/spark:3.5.0
    container_name: traffic-spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --cores 4 --memory 4g --webui-port 8081
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-}
      - AWS_REGION=us-east-1
      - SPARK_WORKER_OPTS=-Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.appDataTtl=259200
    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./data:/opt/data:ro 
    ports:
      - "8092:8081" # worker 2 UI
    restart: unless-stopped
    networks:
      - traffic-net

# ---------------------------------------------------------------- Monitoring
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: traffic-prometheus
    hostname: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle      # cho phép nạp lại config: curl -X POST localhost:9090/-/reload
    ports:
      - "9090:9090"
    volumes:
      # mount cả thư mục: Docker Desktop (Mac/Windows) mount từng file thì sửa xong container vẫn đọc bản cũ/bị cắt cụt
      - ./conf/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      - kafka-exporter
    restart: unless-stopped
    networks:
      - traffic-net

  grafana:
    image: grafana/grafana:13.2.4-slim
    container_name: traffic-grafana
    hostname: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker-data/grafana:/var/lib/grafana
      - ./conf/grafana/provisioning:/etc/grafana/provisioning:ro   # datasource Prometheus + khai báo thư mục dashboard
      - ./conf/grafana/dashboards:/etc/grafana/dashboards:ro       # file JSON dashboard (Kafka, Spark)
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - traffic-net

  serving-api:
    build:
      context: ./serving
      dockerfile: ../dockerfiles/serving-api.dockerfile
    image: ad/serving-api:1.0
    container_name: traffic-serving-api
    hostname: serving-api
    profiles: ["serving", "demo"]
    environment:
      - SERVING_SOURCE=${SERVING_SOURCE:-demo}   # thư mục này không có Trino; trong repo đầy đủ đặt =trino
      - TRINO_HOST=trino
      - TRINO_PORT=8080
      - TRINO_USER=serving_api
      - DEMO_CH_HOST=serving-clickhouse
    volumes:
      - ./serving:/app/serving:ro
    ports:
      - "127.0.0.1:8000:8000"   # API + docs: http://localhost:8000/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/meta', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - traffic-net

  serving-web:
    build:
      context: ./serving/web
      dockerfile: ../../dockerfiles/serving-web.dockerfile
    image: ad/serving-web:1.0
    container_name: traffic-serving-web
    profiles: ["serving", "demo"]
    ports:
      - "3000:80"               # Dashboard: http://localhost:3000
    restart: unless-stopped
    networks:
      - traffic-net

  serving-clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: traffic-serving-clickhouse
    hostname: serving-clickhouse
    profiles: ["demo"]
    environment:
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=demo
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - serving_demo_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - traffic-net

  serving-demo-load:
    image: ad/serving-api:1.0
    profiles: ["demo-load"]
    command: ["python", "-m", "serving.demo.load_demo"]
    environment:
      - TRAFFICSP_ROOT=/app
      - DEMO_CH_HOST=serving-clickhouse
    volumes:
      - ./serving:/app/serving:ro
      - ./data:/app/data:ro
    depends_on:
      serving-clickhouse:
        condition: service_healthy
    networks:
      - traffic-net

  serving-demo-replay:
    image: ad/serving-api:1.0
    container_name: traffic-serving-demo-replay
    profiles: ["demo"]
    command: ["python", "-m", "serving.demo.replay_demo", "--start", "${DEMO_START:-2025-10-07 05:00}", "--speed", "${DEMO_SPEED:-20}"]
    environment:
      - TRAFFICSP_ROOT=/app
      - DEMO_CH_HOST=serving-clickhouse
    volumes:
      - ./serving:/app/serving:ro
      - ./data:/app/data:ro
    depends_on:
      serving-clickhouse:
        condition: service_healthy
    restart: "no"
    networks:
      - traffic-net

networks:
  traffic-net:
    name: traffic-net
    driver: bridge

volumes:
  kafka_data:
    name: traffic_kafka_data
  prometheus_data:
    name: traffic_prometheus_data
  serving_demo_data:
    name: traffic_serving_demo_data
