# Prometheus: Kafka, Spark, tài nguyên container (cAdvisor) và máy chạy Docker (node-exporter)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Kafka qua kafka-exporter: offset từng partition (tốc độ producer đẩy vào traffic_raw/weather_raw).
  # Lag consumer group không có ý nghĩa vì Spark không commit offset vào consumer group.
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Spark standalone: bật PrometheusServlet trong conf/spark-defaults.conf
  - job_name: spark-master
    metrics_path: /metrics/master/prometheus
    static_configs:
      - targets: ["spark-master:8080"]

  - job_name: spark-applications
    metrics_path: /metrics/applications/prometheus
    static_configs:
      - targets: ["spark-master:8080"]

  - job_name: spark-worker
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["spark-worker-1:8081", "spark-worker-2:8081"]

  # Driver Spark của các job batch (driver chạy trong airflow-scheduler, chỉ mở cổng khi có job chạy)
  # Driver redirect 302 /metrics/prometheus -> /metrics/prometheus/ nên phải có dấu "/" cuối
  - job_name: spark-driver
    metrics_path: /metrics/prometheus/
    static_configs:
      - targets: ["airflow-scheduler:4040"]

  - job_name: spark-executors
    metrics_path: /metrics/executors/prometheus
    static_configs:
      - targets: ["airflow-scheduler:4040"]

  # Driver Spark của Speed Layer: chạy trong spark-master (jobs/stream/run_speed_layer.sh), Spark UI cố định cổng 4041
  # (config.SPEED_UI_PORT) để không đụng cổng 4040 của job batch.
  - job_name: spark-speed-layer
    metrics_path: /metrics/prometheus/
    static_configs:
      - targets: ["spark-master:4041"]

  - job_name: spark-speed-layer-executors
    metrics_path: /metrics/executors/prometheus
    static_configs:
      - targets: ["spark-master:4041"]

  # CPU / RAM / mạng / IO theo container. Chỉ giữ các họ metric dashboard dùng để TSDB nhỏ (trần 1 GB trong compose).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|memory_rss|spec_memory_limit_bytes|network_receive_bytes_total|network_transmit_bytes_total|fs_reads_bytes_total|fs_writes_bytes_total|oom_events_total|last_seen)
        action: keep
      - source_labels: [name]
        regex: ""
        action: drop
      - regex: "container_label_.*|image|id"
        action: labeldrop

  # Máy chạy Docker (VM WSL2 của Docker Desktop): CPU, RAM, swap, đĩa
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
