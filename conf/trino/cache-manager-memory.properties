# Ghi đè file mặc định của image trinodb/trino (fs.memory-cache.max-size=2GB, ttl=24h).
# Cache nằm TRONG heap: với container 3 GB (heap ~2,4 GB) cache 2 GB làm heap đầy, Trino GC dừng 10-15 s,
# truy vấn suy luận lỗi "too many errors talking to a worker node". 512 MB vẫn đủ giữ metadata/file nóng.
cache-manager.name=memory
fs.memory-cache.max-size=512MB
fs.memory-cache.ttl=2h
