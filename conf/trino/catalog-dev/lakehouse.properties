# Catalog Trino CHỈ cho môi trường dev không có MinIO (docker-compose.dev.yml).
# Khác bản chính duy nhất ở chỗ lưu trữ: warehouse Iceberg nằm trên volume chung /opt/lakehouse (Spark ghi bằng HadoopFileIO,
# đường dẫn dạng file:/opt/lakehouse/warehouse/...). Trino 484 đọc được nhờ file system local:
#   - thuộc tính là fs.local.enabled (tên cũ fs.native-local.enabled đã đổi);
#   - local.location=/ để đường dẫn file:/opt/... trong metadata trỏ đúng chỗ (không bị cộng thêm tiền tố).
connector.name=iceberg

iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=lakehouse
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg_catalog
iceberg.jdbc-catalog.connection-user=iceberg
iceberg.jdbc-catalog.connection-password=${ENV:ICEBERG_DB_PASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=file:///opt/lakehouse/warehouse

fs.local.enabled=true
local.location=/

iceberg.security=file
security.config-file=/etc/trino/access/lakehouse-rules.json
