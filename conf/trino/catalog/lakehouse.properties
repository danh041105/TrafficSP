connector.name=iceberg

# ---------- Iceberg JDBC Catalog (cùng Postgres với Spark) ----------
iceberg.catalog.type=jdbc
# BẮT BUỘC = "lakehouse", trùng tên catalog bên Spark (spark.sql.catalog.lakehouse)
iceberg.jdbc-catalog.catalog-name=lakehouse
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg_catalog
iceberg.jdbc-catalog.connection-user=iceberg
iceberg.jdbc-catalog.connection-password=${ENV:ICEBERG_DB_PASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=s3://lakehouse/warehouse

# ---------- MinIO (S3) ----------
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}

# Spark là nơi ghi DỮ LIỆU duy nhất. Trino chỉ đọc bảng, nhưng cần tạo VIEW Serving Layer (schema `serving`)
# -> dùng quyền theo file thay cho read_only (read_only chặn cả CREATE VIEW). Xem conf/trino/access/lakehouse-rules.json.
iceberg.security=file
security.config-file=/etc/trino/access/lakehouse-rules.json