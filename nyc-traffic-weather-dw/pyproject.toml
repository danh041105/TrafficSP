[project]
name = "nyc-traffic-weather-dw"
version = "0.1.0"
description = "Kimball data warehouse: NYC DOT Traffic Speeds x Open-Meteo weather, 2025"
requires-python = ">=3.11"
dependencies = [
  "pyarrow>=15",
  "pandas>=2.1",
  "pyyaml>=6",
  "duckdb>=1.0",        # chua cai tren may - cho xac nhan
]

[project.optional-dependencies]
dev = ["pytest>=8"]     # chua cai tren may - cho xac nhan

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
